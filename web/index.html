<!--
  fivem-watch - Hidden NUI Page
  Self-contained CFX/Three capture path.
  Uses the required CfxTexture/WebGL primitives without depending on an
  external screenshot resource at runtime.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { background-color: transparent; margin: 0; padding: 0; }
    html, body { overflow: hidden; width: 100vw; height: 100vh; }
    #app {
      position: fixed;
      top: -99999px;
      left: -99999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="app"></div>

<!-- Socket.io client -->
<script src="socket.io.min.js"></script>

<!-- @citizenfx/three bundle -->
<script src="cfx-three.min.js"></script>

<script>
// ---- State ----
let socket = null;
let isCapturing = false;
let config = {
  backendUrl: 'https://137.131.156.73.sslip.io',
  apiSecret: '',
  streamToken: '',
  playerId: 0,
  streamFps: 20,
  streamQuality: 0.5,
  resolutionScale: 0.4,
};

// ---- Three.js resources ----
let renderer, sceneRTT, cameraRTT, rtTexture, material, gameTexture, quad;
let outputCanvas, outputCtx;
let captureRequestPending = false;
let captureIntervalTimer = null;
let animationFrameId = null;
let cachedPixelBuffer = null;
let cachedBufferLength = 0;
let cachedImageData = null;

function getNativeWidth() {
  return window.innerWidth || (window.screen && window.screen.width) || 1920;
}

function getNativeHeight() {
  return window.innerHeight || (window.screen && window.screen.height) || 1080;
}

function getResolutionScale() {
  const s = parseFloat(config.resolutionScale);
  if (isNaN(s)) return 0.5;
  return Math.max(0.1, Math.min(1.0, s));
}

function getScaledDimensions() {
  const nw = getNativeWidth();
  const nh = getNativeHeight();
  const scale = getResolutionScale();
  // Garante dimensões pares para codificação ótima em WebP
  const scaledW = Math.max(160, Math.floor((nw * scale) / 2) * 2);
  const scaledH = Math.max(120, Math.floor((nh * scale) / 2) * 2);
  return { nw, nh, scale, scaledW, scaledH };
}

function init() {
  const T = window.CFX_THREE;
  if (!T) {
    console.error('[vanguard_dashboard] window.CFX_THREE not available');
    return;
  }

  const { nw, nh, scale, scaledW, scaledH } = getScaledDimensions();

  // Camera ortográfica dimensionada exatamente para o viewport scaled
  cameraRTT = new T.OrthographicCamera(scaledW / -2, scaledW / 2, scaledH / 2, scaledH / -2, -10000, 10000);
  cameraRTT.position.z = 100;

  // Scene
  sceneRTT = new T.Scene();

  // Render Target criado DIRETAMENTE na resolução scaled (downscale 100% na GPU)
  rtTexture = new T.WebGLRenderTarget(scaledW, scaledH, {
    minFilter: T.LinearFilter,
    magFilter: T.LinearFilter,
    format: T.RGBAFormat,
    type: T.UnsignedByteType
  });

  // Game Texture (CfxTexture)
  gameTexture = new T.CfxTexture();
  gameTexture.needsUpdate = true;

  // Material & Shader
  material = new T.ShaderMaterial({
    uniforms: { "tDiffuse": { value: gameTexture } },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = vec2(uv.x, 1.0-uv.y); // Y-flip
        gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      uniform sampler2D tDiffuse;
      void main() {
        vec4 tex = texture2D( tDiffuse, vUv );
        gl_FragColor = vec4( tex.rgb, 1.0 );
      }
    `
  });

  // Quad mesh alinhado ao viewport scaled
  const plane = new T.PlaneGeometry(scaledW, scaledH);
  quad = new T.Mesh(plane, material);
  quad.position.z = -100;
  sceneRTT.add(quad);

  // Renderer configurado para resolução scaled
  if (!renderer) {
    renderer = new T.WebGLRenderer({ antialias: false, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(scaledW, scaledH, false);
    renderer.autoClear = false;

    // Attach to DOM (offscreen via CSS, NEVER display: none)
    const appEl = document.getElementById('app');
    appEl.appendChild(renderer.domElement);

    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      console.warn('[vanguard_dashboard] WebGL context lost!');
    }, false);
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      console.log('[vanguard_dashboard] WebGL context restored, re-initializing...');
      init();
    }, false);
  } else {
    renderer.setSize(scaledW, scaledH, false);
  }

  // Output Canvas 2D diretamente na resolução scaled (rawCanvas eliminado)
  if (!outputCanvas) {
    outputCanvas = document.createElement('canvas');
    outputCtx = outputCanvas.getContext('2d');
  }
  outputCanvas.width = scaledW;
  outputCanvas.height = scaledH;

  window.removeEventListener('resize', handleWindowResize);
  window.addEventListener('resize', handleWindowResize);

  console.log(`[vanguard_dashboard] Engine initialized with GPU downscale (standby): ${nw}x${nh} -> ${scaledW}x${scaledH} (scale: ${scale})`);
}

function updateDimensions() {
  const T = window.CFX_THREE;
  if (!T || !renderer) return;

  const { nw, nh, scale, scaledW, scaledH } = getScaledDimensions();
  if (rtTexture && rtTexture.width === scaledW && rtTexture.height === scaledH) {
    return;
  }

  console.log(`[vanguard_dashboard] Resizing WebGL pipeline: ${nw}x${nh} -> ${scaledW}x${scaledH} (scale: ${scale})`);

  if (cameraRTT) {
    cameraRTT.left = scaledW / -2;
    cameraRTT.right = scaledW / 2;
    cameraRTT.top = scaledH / 2;
    cameraRTT.bottom = scaledH / -2;
    cameraRTT.updateProjectionMatrix();
  }

  if (rtTexture) {
    try { rtTexture.dispose(); } catch (_e) {}
  }
  rtTexture = new T.WebGLRenderTarget(scaledW, scaledH, {
    minFilter: T.LinearFilter,
    magFilter: T.LinearFilter,
    format: T.RGBAFormat,
    type: T.UnsignedByteType
  });

  if (quad && quad.geometry) {
    try { quad.geometry.dispose(); } catch (_e) {}
    quad.geometry = new T.PlaneGeometry(scaledW, scaledH);
  }

  renderer.setSize(scaledW, scaledH, false);

  if (outputCanvas) {
    outputCanvas.width = scaledW;
    outputCanvas.height = scaledH;
  }

  cachedPixelBuffer = null;
  cachedImageData = null;
  cachedBufferLength = 0;

  if (gameTexture) gameTexture.needsUpdate = true;
  if (material) material.needsUpdate = true;
}

function handleWindowResize() {
  updateDimensions();
}

function animate() {
  if (!isCapturing) {
    animationFrameId = null;
    return;
  }

  animationFrameId = requestAnimationFrame(animate);

  if (captureRequestPending) {
    captureRequestPending = false;
    if (renderer && sceneRTT && cameraRTT && rtTexture) {
      renderer.clear();
      renderer.render(sceneRTT, cameraRTT, rtTexture, true);
    }
    processCapture();
  }
}

function processCapture() {
  if (!isCapturing || !socket?.connected || !renderer || !rtTexture) return;

  const targetW = rtTexture.width;
  const targetH = rtTexture.height;
  const requiredBytes = targetW * targetH * 4;

  // Reutiliza buffer para zerar garbage collection churn (evita alocar 10GB/min)
  if (!cachedPixelBuffer || cachedBufferLength !== requiredBytes) {
    cachedBufferLength = requiredBytes;
    cachedPixelBuffer = new Uint8Array(requiredBytes);
    cachedImageData = new ImageData(targetW, targetH);
  }

  // Leitura direta da GPU já na resolução reduzida (elimina gargalo PCIe 1080p/4K)
  renderer.readRenderTargetPixels(rtTexture, 0, 0, targetW, targetH, cachedPixelBuffer);

  // Garante canal alfa = 255 (totalmente opaco, corrige frames transparentes do DirectX)
  for (let i = 3; i < cachedPixelBuffer.length; i += 4) {
    cachedPixelBuffer[i] = 255;
  }

  // Copia direta dos pixels para o ImageData sem intermediate rawCanvas
  cachedImageData.data.set(cachedPixelBuffer);

  if (outputCanvas.width !== targetW || outputCanvas.height !== targetH) {
    outputCanvas.width = targetW;
    outputCanvas.height = targetH;
  }
  outputCtx.putImageData(cachedImageData, 0, 0);

  // Transmissão estável em WebP Base64 (garantida no CEF e em todos os navegadores)
  const quality = typeof config.streamQuality === 'number' ? config.streamQuality : 0.5;
  const frameData = outputCanvas.toDataURL('image/webp', quality);
  socket.emit('frame', frameData);
}

window.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg) return;
  console.log('[vanguard_dashboard NUI] Mensagem recebida:', msg.type);
  if (msg.type === 'init') {
    const isSameTarget = socket && config.backendUrl === msg.backendUrl && String(config.playerId) === String(msg.playerId);
    const oldScale = config.resolutionScale;
    Object.assign(config, msg);
    if (config.resolutionScale !== oldScale) {
      updateDimensions();
    }
    if (isSameTarget) {
      // Já inicializado com mesmo target; Socket.io gerencia reconexão automaticamente
      return;
    }

    if (socket) {
      try { socket.disconnect(); } catch (_e) {}
      socket = null;
    }
    connectToBackend();
  } else if (msg.type === 'setStreamToken') {
    if (msg.streamToken) {
      config.streamToken = msg.streamToken;
      if (!socket || !socket.connected) {
        connectToBackend();
      }
    }
  } else if (msg.type === 'stopCapture') {
    stopCapture();
  }
});

// Dynamic config coming from backend (when admin changes settings)
function handleConfigUpdate(newConfig) {
  const oldFps = config.streamFps;
  const oldScale = config.resolutionScale;
  Object.assign(config, newConfig);

  // Redimensiona o WebGL RenderTarget caso a escala mude dinamicamente
  if (config.resolutionScale !== oldScale) {
    updateDimensions();
  }

  if (oldFps !== config.streamFps && isCapturing) {
    stopCapture();
    startCapture();
  }
}

// ---- Networking & Controls ----

function connectToBackend() {
  if (socket?.connected) return;

  if (typeof io !== 'function') {
    console.error('[vanguard_dashboard] socket.io client not available');
    return;
  }

  const endpoint = (config.backendUrl || 'https://137.131.156.73.sslip.io').replace(/\/+$/, '');
  console.log('[vanguard_dashboard] Connecting NUI socket to:', endpoint, 'player:', config.playerId);

  socket = io(endpoint, {
    auth: {
      role: 'fivem-nui',
      secret: config.apiSecret || '',
      streamToken: config.streamToken || '',
      playerId: config.playerId
    },
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 30,
    reconnectionDelay: 2000,
  });

  socket.on('connect', () => {
    console.log('[vanguard_dashboard] ✓ NUI Socket connected to backend over WSS');
    try {
      const resName = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'vanguard_dashboard';
      fetch(`https://${resName}/nuiConnected`, { method: 'POST', body: '{}' }).catch(() => {});
    } catch (_e) {}
  });

  socket.on('connect_error', (err) => {
    console.warn('[vanguard_dashboard] Socket connection error:', err?.message || err);
  });

  socket.on('disconnect', (reason) => {
    console.log('[vanguard_dashboard] Socket disconnected:', reason);
    stopCapture();
  });

  socket.on('start_capture', startCapture);
  socket.on('stop_capture', stopCapture);
  socket.on('update_config', handleConfigUpdate);
}

function startCapture() {
  if (isCapturing) return;
  isCapturing = true;

  updateDimensions();

  if (gameTexture) gameTexture.needsUpdate = true;
  if (material) material.needsUpdate = true;

  const interval = Math.floor(1000 / Math.max(1, config.streamFps || 20));
  captureIntervalTimer = setInterval(() => {
    captureRequestPending = true;
  }, interval);

  if (!animationFrameId) {
    animationFrameId = requestAnimationFrame(animate);
  }

  console.log(`[vanguard_dashboard] Capture started at ${config.streamFps} FPS`);
}

function stopCapture() {
  isCapturing = false;
  captureRequestPending = false;
  if (captureIntervalTimer) {
    clearInterval(captureIntervalTimer);
    captureIntervalTimer = null;
  }
  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  console.log('[vanguard_dashboard] Capture stopped (Three.js WebGL paused)');
}

// Start graphics engine
try {
  init();
} catch (e) {
  console.error('[vanguard_dashboard] Failed to initialize Three.js engine:', e);
}

// Notify client script that NUI DOM and scripts are ready
try {
  const resName = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'vanguard_dashboard';
  fetch(`https://${resName}/nuiReady`, { method: 'POST', body: '{}' }).catch(() => {});
} catch (_e) {}

</script>
</body>
</html>
